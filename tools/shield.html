<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Shield Icon</title></head>
<body>
<canvas id="c512" width="512" height="512"></canvas>
<canvas id="c192" width="192" height="192"></canvas>
<script>
function drawShield(canvas) {
  const size = canvas.width;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  // Background transparent (or solid dark). Use transparent.
  const cx = size / 2;
  const top = size * 0.08;
  const bottom = size * 0.92;
  const left = size * 0.12;
  const right = size * 0.88;
  const mid = size * 0.55;

  // Shield path
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.lineTo(right, top + size*0.06);
  ctx.lineTo(right, mid);
  ctx.quadraticCurveTo(right, bottom, cx, bottom);
  ctx.lineTo(left, mid);
  ctx.lineTo(left, top + size*0.06);
  ctx.closePath();

  // Left half white
  ctx.save();
  ctx.clip();
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, cx, size);
  ctx.restore();

  // Right half black
  ctx.save();
  ctx.clip();
  ctx.fillStyle = '#000000';
  ctx.fillRect(cx, 0, size, size);
  ctx.restore();

  // Outline
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.lineTo(right, top + size*0.06);
  ctx.lineTo(right, mid);
  ctx.quadraticCurveTo(right, bottom, cx, bottom);
  ctx.lineTo(left, mid);
  ctx.lineTo(left, top + size*0.06);
  ctx.closePath();
  ctx.strokeStyle = '#888888';
  ctx.lineWidth = size * 0.02;
  ctx.stroke();
}

drawShield(document.getElementById('c512'));
drawShield(document.getElementById('c192'));
window.__icons = {
  '512': document.getElementById('c512').toDataURL('image/png'),
  '192': document.getElementById('c192').toDataURL('image/png')
};
</script>
</body>
</html>
